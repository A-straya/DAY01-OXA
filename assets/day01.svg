<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010b0e"/>
      <stop offset="55%" stop-color="#021f28"/>
      <stop offset="100%" stop-color="#010b0e"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffb0"/><stop offset="50%" stop-color="#9dffe8"/><stop offset="100%" stop-color="#00ffb0"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/><stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="winBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fd8ff"/><stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <filter id="glowG" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowB" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowR" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="260" rx="14"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010b0e" stop-opacity="0"/><stop offset="100%" stop-color="#010b0e" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#bgGrad)"/>

    <!-- hex rain -->
    <g font-family="Consolas,monospace" font-size="10.5" fill="#0a4a3a">
      <text x="610" y="20">0x4F</text><text x="760" y="70">0x9A</text><text x="820" y="115">0x2C</text>
      <text x="650" y="150">0xE1</text><text x="500" y="25">0x33</text>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2.8s" repeatCount="indefinite"/>
    </g>

    <!-- grid floor (blue), more lines, faster flicker -->
    <g stroke="#0077ff" stroke-width="1.1" opacity="0.55">
      <line x1="450" y1="150" x2="40"  y2="258"/>
      <line x1="450" y1="150" x2="190" y2="258"/>
      <line x1="450" y1="150" x2="340" y2="258"/>
      <line x1="450" y1="150" x2="450" y2="258"/>
      <line x1="450" y1="150" x2="560" y2="258"/>
      <line x1="450" y1="150" x2="710" y2="258"/>
      <line x1="450" y1="150" x2="860" y2="258"/>
    </g>
    <g stroke="#00ffb0" stroke-width="1" opacity="0.45">
      <line x1="120" y1="178" x2="780" y2="178"/>
      <line x1="60"  y1="205" x2="840" y2="205"/>
      <line x1="0"   y1="236" x2="900" y2="236"/>
      <animate attributeName="opacity" values="0.45;0.1;0.45" dur="1.8s" repeatCount="indefinite"/>
    </g>

    <!-- double scanning beams -->
    <rect x="0" y="-20" width="900" height="18" fill="#00ffb0" opacity="0.1">
      <animate attributeName="y" values="-20;260" dur="3.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="280" width="900" height="10" fill="#00e5ff" opacity="0.12">
      <animate attributeName="y" values="280;-10" dur="4.4s" repeatCount="indefinite"/>
    </rect>

    <!-- kicker -->
    <text x="40" y="40" font-family="Consolas,monospace" font-size="12.5" fill="#00e5ff" letter-spacing="3" filter="url(#glowB)">
      PENTEST &amp; NETWORK SECURITY LAB
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </text>

    <!-- red live alert cluster -->
    <circle cx="640" cy="37" r="5" fill="#ff3b3b" filter="url(#glowR)">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="652" y="41" font-family="Consolas,monospace" font-size="11" fill="#ff5c5c" letter-spacing="1.5">INTRUSION WATCH: ARMED</text>

    <!-- title with triple-channel RGB-split glitch -->
    <g>
      <text x="36" y="118" font-family="'Courier New',monospace" font-weight="bold" font-size="66" fill="#ff3b3b" letter-spacing="4" opacity="0">
        OXA
        <animate attributeName="opacity" values="0;0;0.6;0;0;0.4;0" keyTimes="0;0.3;0.33;0.37;0.6;0.63;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="36;30;36" keyTimes="0;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <text x="42" y="118" font-family="'Courier New',monospace" font-weight="bold" font-size="66" fill="#00e5ff" letter-spacing="4" opacity="0">
        OXA
        <animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.3;0.33;0.37;1" dur="2.6s" repeatCount="indefinite"/>
        <animate attributeName="x" values="42;47;42" keyTimes="0;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </text>
      <g filter="url(#glowG)">
        <text x="39" y="118" font-family="'Courier New',monospace" font-weight="bold" font-size="66" fill="url(#neonGreen)" letter-spacing="4">OXA</text>
      </g>
    </g>

    <text x="40" y="150" font-family="Consolas,monospace" font-size="17" fill="url(#neonBlue)" letter-spacing="2" filter="url(#glowB)">
      PENTESTING &amp; HARDENING
    </text>

    <!-- terminal -->
    <g font-family="Consolas,monospace" font-size="14">
      <rect x="38" y="172" width="590" height="64" rx="6" fill="#020a0c" stroke="#00e5ff" stroke-opacity="0.5">
        <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="54" cy="186" r="4" fill="#ff5f56"/>
      <circle cx="68" cy="186" r="4" fill="#ffbd2e"/>
      <circle cx="82" cy="186" r="4" fill="#27c93f"/>
      <g transform="translate(96,180)">
        <rect x="0" y="0" width="6.3" height="6.3" fill="url(#winBlue)"/>
        <rect x="7.3" y="0" width="6.3" height="6.3" fill="url(#winBlue)"/>
        <rect x="0" y="7.3" width="6.3" height="6.3" fill="url(#winBlue)"/>
        <rect x="7.3" y="7.3" width="6.3" height="6.3" fill="url(#winBlue)"/>
      </g>
      <text x="118" y="212" fill="#00e5ff">
        <tspan fill="#4dffd1">root@oxa</tspan><tspan fill="#5a7a85">:</tspan><tspan fill="#00e5ff">~#</tspan>
        <tspan fill="#d7fbf5"> ./deploy_day01.sh --target=oxa.local --force</tspan>
      </text>
      <rect x="560" y="200" width="9" height="14" fill="#00ffb0"><animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/></rect>

      <text x="54" y="228" fill="#7CFFB2" font-size="12.5">
        [OK] AD DS · DNS · DHCP · IIS · SMB → online
        <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.25;0.4;0.8;0.85;1" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="54" y="228" fill="#ff6b6b" font-size="12.5">
        [WARN] SMBv1 &amp; weak creds flagged — day02 target
        <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.42;0.46;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- badge -->
    <g transform="translate(730,188)">
      <rect x="0" y="0" width="150" height="48" rx="24" fill="#010b0e" stroke="url(#neonBlue)" stroke-width="1.8">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="75" y="19" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#8fb3bd" letter-spacing="2">DAY</text>
      <text x="75" y="37" text-anchor="middle" font-family="Consolas,monospace" font-weight="bold" font-size="17" fill="url(#neonGreen)" filter="url(#glowG)">01 / BUILD</text>
    </g>

    <!-- big pulsing windows motif top-right -->
    <g transform="translate(828,26)">
      <rect x="0" y="0" width="13" height="13" fill="url(#winBlue)"/>
      <rect x="15" y="0" width="13" height="13" fill="url(#winBlue)"/>
      <rect x="0" y="15" width="13" height="13" fill="url(#winBlue)"/>
      <rect x="15" y="15" width="13" height="13" fill="url(#winBlue)"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.18;1" additive="sum" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- scanlines -->
    <g opacity="0.14" fill="#000000">
      <rect y="0" width="900" height="1"/><rect y="4" width="900" height="1"/><rect y="8" width="900" height="1"/><rect y="12" width="900" height="1"/>
      <rect y="16" width="900" height="1"/><rect y="20" width="900" height="1"/><rect y="24" width="900" height="1"/><rect y="28" width="900" height="1"/>
      <rect y="32" width="900" height="1"/><rect y="36" width="900" height="1"/><rect y="40" width="900" height="1"/><rect y="44" width="900" height="1"/>
      <rect y="48" width="900" height="1"/><rect y="52" width="900" height="1"/><rect y="56" width="900" height="1"/><rect y="60" width="900" height="1"/>
      <rect y="64" width="900" height="1"/><rect y="68" width="900" height="1"/><rect y="72" width="900" height="1"/><rect y="76" width="900" height="1"/>
      <rect y="80" width="900" height="1"/><rect y="84" width="900" height="1"/><rect y="88" width="900" height="1"/><rect y="92" width="900" height="1"/>
      <rect y="96" width="900" height="1"/><rect y="100" width="900" height="1"/><rect y="104" width="900" height="1"/><rect y="108" width="900" height="1"/>
      <rect y="112" width="900" height="1"/><rect y="116" width="900" height="1"/><rect y="120" width="900" height="1"/><rect y="124" width="900" height="1"/>
      <rect y="128" width="900" height="1"/><rect y="132" width="900" height="1"/><rect y="136" width="900" height="1"/><rect y="140" width="900" height="1"/>
      <rect y="144" width="900" height="1"/><rect y="148" width="900" height="1"/><rect y="152" width="900" height="1"/><rect y="156" width="900" height="1"/>
      <rect y="160" width="900" height="1"/><rect y="164" width="900" height="1"/><rect y="168" width="900" height="1"/><rect y="172" width="900" height="1"/>
      <rect y="176" width="900" height="1"/><rect y="180" width="900" height="1"/><rect y="184" width="900" height="1"/><rect y="188" width="900" height="1"/>
      <rect y="192" width="900" height="1"/><rect y="196" width="900" height="1"/><rect y="200" width="900" height="1"/><rect y="204" width="900" height="1"/>
      <rect y="208" width="900" height="1"/><rect y="212" width="900" height="1"/><rect y="216" width="900" height="1"/><rect y="220" width="900" height="1"/>
      <rect y="224" width="900" height="1"/><rect y="228" width="900" height="1"/><rect y="232" width="900" height="1"/><rect y="236" width="900" height="1"/>
      <rect y="240" width="900" height="1"/><rect y="244" width="900" height="1"/><rect y="248" width="900" height="1"/><rect y="252" width="900" height="1"/>
      <rect y="256" width="900" height="1"/>
    </g>

    <rect width="900" height="90" y="170" fill="url(#fade)"/>
    <rect x="1" y="1" width="898" height="258" rx="13" fill="none" stroke="url(#neonBlue)" stroke-opacity="0.4" stroke-width="2.4">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
