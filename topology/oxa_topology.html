<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OXA — Live Network Topology</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#011014; --bg2:#021a22;
    --green:#00ffb0; --green-dim:#0a4a3a;
    --blue:#00c8ff; --red:#ff4d4d;
    --ink:#d7fbf5; --muted:#5a7a85;
    --panel:#03181f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 70%);
    font-family:Consolas,'Courier New',monospace; color:var(--ink);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%; overflow-x:hidden;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:22px 16px 40px;}
  header{text-align:center; margin-bottom:6px;}
  header .kicker{color:var(--blue); letter-spacing:3px; font-size:12px; opacity:.9;}
  header h1{color:var(--green); font-size:28px; margin:6px 0 2px; text-shadow:0 0 14px var(--green-dim);}
  header .sub{color:var(--muted); font-size:12.5px;}
  .board{
    display:grid; grid-template-columns: 1fr 300px; gap:16px; margin-top:22px;
  }
  @media (max-width: 820px){ .board{grid-template-columns:1fr;} }
  .stage{
    position:relative; background:#010b0e; border:1px solid #0b3a40; border-radius:14px;
    overflow:hidden; min-height:420px;
  }
  .stage svg{width:100%; height:100%; display:block;}
  .legend{
    position:absolute; left:14px; bottom:12px; font-size:10.5px; color:var(--muted);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .legend span{display:inline-flex; align-items:center; gap:6px; margin-right:14px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}
  .node-label{fill:var(--ink); font-size:12px; font-weight:bold;}
  .node-sub{fill:var(--muted); font-size:9.5px;}
  .node rect, .node circle.ring{ cursor:pointer; transition:filter .15s ease; }
  .node:hover rect, .node:hover circle.ring{ filter:brightness(1.35); }
  .panel{
    background:var(--panel); border:1px solid #0b3a40; border-radius:14px; padding:16px;
    min-height:420px; display:flex; flex-direction:column;
  }
  .panel h2{margin:0 0 2px; font-size:16px; color:var(--green);}
  .panel .ip{color:var(--blue); font-size:12px; margin-bottom:10px;}
  .panel .status{
    display:inline-block; font-size:10px; padding:3px 9px; border-radius:20px; margin-bottom:12px;
    border:1px solid currentColor; letter-spacing:1px;
  }
  .panel .status.online{color:var(--green);}
  .panel .status.standby{color:var(--red);}
  .panel ul{margin:0; padding-left:16px; font-size:12.5px; color:var(--ink); line-height:1.7;}
  .panel .hint{color:var(--muted); font-size:12px; line-height:1.6;}
  .panel .row{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); border-top:1px dashed #0b3a40; padding:7px 0;}
  .panel .row b{color:var(--ink); font-weight:normal;}
  .badge-row{margin-top:auto; padding-top:10px; display:flex; gap:8px;}
  .badge{font-size:10px; color:var(--muted); border:1px solid #0b3a40; border-radius:8px; padding:4px 8px;}
  .selected-ring{ stroke:var(--green); stroke-width:2.5; filter:drop-shadow(0 0 8px var(--green)); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">PENTEST &amp; NETWORK SECURITY LAB</div>
    <h1>OXA — Live Network Topology</h1>
    <div class="sub">Click any device to inspect it · lines pulse to show live traffic</div>
  </header>

  <div class="board">
    <div class="stage">
      <svg id="svg" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- connection lines -->
        <path id="line-dc" class="link" d="M 230,150 C 320,220 360,260 435,315" stroke="#0a4a3a" stroke-width="2" fill="none"/>
        <path id="line-win" class="link" d="M 670,150 C 580,220 540,260 465,315" stroke="#0a4a3a" stroke-width="2" fill="none"/>
        <path id="line-kali" class="link" d="M 450,345 C 450,390 450,410 450,445" stroke="#3a2a2a" stroke-width="2" stroke-dasharray="6 6" fill="none"/>

        <!-- traffic pulses -->
        <circle r="4" fill="#00ffb0" filter="url(#glow)">
          <animateMotion dur="2.1s" repeatCount="indefinite" path="M 230,150 C 320,220 360,260 435,315"/>
        </circle>
        <circle r="4" fill="#00c8ff" filter="url(#glow)">
          <animateMotion dur="2.6s" repeatCount="indefinite" path="M 670,150 C 580,220 540,260 465,315"/>
        </circle>

        <!-- Switch -->
        <g class="node" data-id="switch" transform="translate(450,330)">
          <circle class="ring" r="34" fill="#031a1f" stroke="#0b3a40" stroke-width="2"/>
          <text class="node-label" text-anchor="middle" y="-4">SWITCH</text>
          <text class="node-sub" text-anchor="middle" y="12">L2</text>
        </g>

        <!-- OXA-DC01 -->
        <g class="node" data-id="dc" transform="translate(230,150)">
          <rect class="ring" x="-78" y="-40" width="156" height="80" rx="12" fill="#031a1f" stroke="#00ffb0" stroke-width="1.6"/>
          <text class="node-label" text-anchor="middle" y="-10">OXA-DC01</text>
          <text class="node-sub" text-anchor="middle" y="6">Windows Server</text>
          <text class="node-sub" text-anchor="middle" y="20">192.168.10.10</text>
        </g>

        <!-- WIN10-CLIENT -->
        <g class="node" data-id="win10" transform="translate(670,150)">
          <rect class="ring" x="-78" y="-40" width="156" height="80" rx="12" fill="#031a1f" stroke="#00c8ff" stroke-width="1.6"/>
          <text class="node-label" text-anchor="middle" y="-10">WIN10-CLIENT</text>
          <text class="node-sub" text-anchor="middle" y="6">Windows 10</text>
          <text class="node-sub" text-anchor="middle" y="20">192.168.10.20</text>
        </g>

        <!-- KALI -->
        <g class="node" data-id="kali" transform="translate(450,480)" opacity="0.75">
          <rect class="ring" x="-78" y="-34" width="156" height="68" rx="12" fill="#1a0e0e" stroke="#ff4d4d" stroke-width="1.4" stroke-dasharray="5 4"/>
          <text class="node-label" text-anchor="middle" y="-6">KALI-ATK01</text>
          <text class="node-sub" text-anchor="middle" y="10">Standby · Day 03</text>
        </g>
      </svg>
      <div class="legend">
        <span><i class="dot" style="background:#00ffb0"></i> AD / DNS / DHCP traffic</span>
        <span><i class="dot" style="background:#00c8ff"></i> Client requests</span>
        <span><i class="dot" style="background:#ff4d4d"></i> Standby node</span>
      </div>
    </div>

    <div class="panel" id="panel">
      <div class="hint">👆 Click a device on the diagram to see its details here.</div>
    </div>
  </div>
</div>

<script>
const DATA = {
  switch: {
    name: "Ethernet Switch", ip: "—", status: "online",
    services: ["Layer 2 connectivity only", "No IP — connects all three nodes"],
    row: [["Role","Core LAN switch"],["Uptime","Since Day 01"]],
    flow: "Relays all traffic between OXA-DC01, WIN10-CLIENT and (later) KALI-ATK01."
  },
  dc: {
    name: "OXA-DC01 — Windows Server", ip: "192.168.10.10 /24", status: "online",
    services: ["Active Directory Domain Services (oxa.local)","DNS Server","DHCP Server (scope .100–.200)","IIS — http://192.168.10.10","SMB share \\\\OXA-DC01\\Finance","FTP (no SSL — intentional)"],
    row: [["Hostname","OXA-DC01"],["Domain","oxa.local"],["Snapshot","00-clean-install"]],
    flow: "Answers DNS lookups, issues DHCP leases, authenticates logons, and serves SMB/IIS/FTP traffic for the whole LAN."
  },
  win10: {
    name: "WIN10-CLIENT — Windows 10", ip: "192.168.10.20 /24 (or DHCP)", status: "online",
    services: ["Domain-joined to oxa.local","Logged in as OXA\\j.martin","Resolves DNS via OXA-DC01","Can browse \\\\OXA-DC01\\Finance"],
    row: [["User","OXA\\j.martin"],["Joined","Yes"]],
    flow: "Sends DNS queries and auth requests to OXA-DC01, and reads/writes files over SMB."
  },
  kali: {
    name: "KALI-ATK01 — Attacker", ip: "192.168.10.30 /24", status: "standby",
    services: ["Nmap recon (Day 03)","Vulnerability scanning (Day 03)","Metasploit exploitation (Day 03)"],
    row: [["Role","Attacker / scanner"],["Active on","Day 03"]],
    flow: "Powered off / standing by. Once live, it will scan and attack OXA-DC01 and WIN10-CLIENT over this same switch."
  }
};

const panel = document.getElementById('panel');
const svg = document.getElementById('svg');

function render(id){
  const d = DATA[id];
  panel.innerHTML = `
    <h2>${d.name}</h2>
    <div class="ip">${d.ip}</div>
    <div class="status ${d.status}">${d.status === 'online' ? '● ONLINE' : '◐ STANDBY'}</div>
    <ul>${d.services.map(s => `<li>${s}</li>`).join('')}</ul>
    <div style="margin-top:10px;">${d.row.map(r => `<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>
    <div class="hint" style="margin-top:10px;">${d.flow}</div>
    <div class="badge-row"><span class="badge">click another node →</span></div>
  `;
}

document.querySelectorAll('.node').forEach(n => {
  n.addEventListener('click', () => {
    document.querySelectorAll('.node .ring').forEach(r => r.classList.remove('selected-ring'));
    n.querySelector('.ring').classList.add('selected-ring');
    render(n.dataset.id);
  });
});
</script>
</body>
</html>
